<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jev City — Barcelona AI Citizen Simulation</title>
    <meta
      name="description"
      content="A replay of 1,000+ AI citizens deciding where to live and work across Barcelona, comparing a rent-cap policy in Gràcia against the baseline."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Bare URL (e.g. the public demo): jump to the story configured in runs/defaults.json,
      // if the deployment ships one. Relative path so it works under any base path.
      if (!location.search) {
        fetch("runs/defaults.json")
          .then((r) => (r.ok ? r.text() : ""))
          .then((q) => { if (q.trim()) location.replace("?" + q.trim()); })
          .catch(() => {});
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
